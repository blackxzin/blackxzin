<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#160a32"><title>Snake roxo • Lucas Gabriel</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 8%,#4c1d95 0%,#210e46 36%,#0d0820 100%);color:#f5f3ff;display:grid;place-items:center;padding:20px}.app{width:min(100%,600px);text-align:center}.back{display:inline-block;margin-bottom:18px;color:#c4b5fd;text-decoration:none}h1{font-size:clamp(2rem,7vw,3.5rem);margin:0 0 4px}.subtitle{color:#c4b5fd;margin:0 0 20px}.stats{display:flex;justify-content:center;gap:12px;margin-bottom:14px}.stats span{background:#2b1656;border:1px solid #6942a8;border-radius:12px;padding:8px 18px}canvas{display:block;width:min(100%,480px);aspect-ratio:1;margin:auto;background:#160a32;border:2px solid #8b5cf6;border-radius:14px;box-shadow:0 20px 70px #070314aa;touch-action:none}.actions{display:flex;justify-content:center;gap:10px;margin:16px 0}button{cursor:pointer;border:1px solid #a78bfa;background:#7c3aed;color:white;border-radius:10px;padding:10px 20px;font:inherit;font-weight:700}button:hover,button:focus-visible{background:#9d65f4;outline:2px solid #ddd6fe;outline-offset:2px}.help{color:#c4b5fd;font-size:.9rem;line-height:1.5}.pad{display:grid;grid-template-columns:repeat(3,54px);gap:7px;justify-content:center;margin:12px auto}.pad button{padding:9px 0}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}@media(pointer:fine){.pad{display:none}}
</style></head><body><main class="app"><a class="back" href="https://github.com/blackxzin">← Voltar ao GitHub</a><h1>🐍 Snake roxo</h1><p class="subtitle">Um intervalo entre um commit e outro.</p><div class="stats"><span>Pontos: <strong id="score">0</strong></span><span>Recorde: <strong id="best">0</strong></span></div><canvas id="board" width="480" height="480" aria-label="Tabuleiro do jogo Snake"></canvas><div class="actions"><button id="start">Começar / reiniciar</button><button id="pause">Pausar</button></div><p class="help" id="status" role="status" aria-live="polite">Clique em começar. Use as setas ou WASD; no celular, deslize ou use os botões.</p><div class="pad" aria-label="Controles direcionais"><button class="up" data-dir="up" aria-label="Cima">↑</button><button class="left" data-dir="left" aria-label="Esquerda">←</button><button class="down" data-dir="down" aria-label="Baixo">↓</button><button class="right" data-dir="right" aria-label="Direita">→</button></div></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),status=document.getElementById('status'),pauseBtn=document.getElementById('pause');const cells=20,size=canvas.width/cells;const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};let snake,food,dir,nextDir,score,best=0,timer=null,paused=false,started=false,ended=false;try{best=Number(localStorage.getItem('lucas-snake-best'))||0}catch{}bestEl.textContent=best;
function spawn(){const empty=[];for(let y=0;y<cells;y++)for(let x=0;x<cells;x++)if(!snake.some(p=>p.x===x&&p.y===y))empty.push({x,y});return empty.length?empty[Math.floor(Math.random()*empty.length)]:null}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=dirs.right;nextDir=dirs.right;score=0;scoreEl.textContent=0;food=spawn();paused=false;started=true;ended=false;pauseBtn.textContent='Pausar';status.textContent='Boa sorte!';clearInterval(timer);timer=setInterval(tick,125);draw()}
function finish(message){clearInterval(timer);timer=null;ended=true;status.textContent=message;draw()}
function turn(name){const chosen=dirs[name];if(!chosen||!started||paused||ended)return;if(chosen.x===-dir.x&&chosen.y===-dir.y)return;nextDir=chosen}
function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eat=food&&head.x===food.x&&head.y===food.y;const body=eat?snake:snake.slice(0,-1);if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||body.some(p=>p.x===head.x&&p.y===head.y)){finish('Fim de jogo! Clique em começar para tentar de novo.');return}snake.unshift(head);if(eat){score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('lucas-snake-best',String(best))}catch{}}food=spawn();if(!food){finish('Você venceu! Tabuleiro completo.');return}}else snake.pop();draw()}
function draw(){ctx.fillStyle='#160a32';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#ffffff0b';for(let i=1;i<cells;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,480);ctx.moveTo(0,i*size);ctx.lineTo(480,i*size);ctx.stroke()}if(food){ctx.fillStyle='#fb7185';ctx.beginPath();ctx.arc((food.x+.5)*size,(food.y+.5)*size,size*.34,0,Math.PI*2);ctx.fill()}snake.forEach((p,i)=>{ctx.fillStyle=i?'#9f7aea':'#ddd6fe';ctx.beginPath();ctx.roundRect(p.x*size+2,p.y*size+2,size-4,size-4,6);ctx.fill()});if(!started||paused||ended){ctx.fillStyle='#100824bb';ctx.fillRect(0,0,480,480);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 30px system-ui';ctx.fillText(!started?'SNAKE':paused?'PAUSADO':'FIM DE JOGO',240,242)}}
document.getElementById('start').addEventListener('click',reset);pauseBtn.addEventListener('click',()=>{if(!started||ended)return;paused=!paused;pauseBtn.textContent=paused?'Continuar':'Pausar';status.textContent=paused?'Jogo pausado.':'Boa sorte!';draw()});document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(map[e.key]){e.preventDefault();turn(map[e.key])}if(e.code==='Space'){e.preventDefault();pauseBtn.click()}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>turn(b.dataset.dir)));let startX=0,startY=0;canvas.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;turn(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];food={x:14,y:10};draw()})();
</script></body></html>
